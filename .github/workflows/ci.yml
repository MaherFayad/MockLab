name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install workspaces
        run: npm ci
      - name: Test
        run: npm test -ws
      - name: Check the extension manifest parses
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"

  browser:
    # Both browser suites load the REAL unpacked extension in real Chromium. They skip
    # themselves when Playwright is missing, so the job above stays green anywhere —
    # this job is what makes them actually run, and it must run BOTH files.
    #
    # e2e.browser.test.js guards defects unit tests could not see: a streaming response
    # that froze the page, a match entry that could not match its own URL, a stream that
    # was never released.
    #
    # picker.browser.test.js and pickerdom.browser.test.js guard M3. The picker is DOM
    # behaviour end to end — an overlay a site's CSS can erase, a listener that never
    # comes off, an area ratio that is measured rather than assumed — and none of it is
    # visible to a unit test. Both files must be listed: a suite a CI job never invokes
    # is a suite that is not run, and this repository has already shipped one of those.
    #
    # panel.probe.browser.test.js guards §17.12 at the moment it becomes possible to
    # break: it renders §10.1's State D, its progress card and its failure cards, and
    # holds every "Verified ✓" on screen to a link whose own state really is verified.
    #
    # panel.browser.test.js guards §1.1 itself. Changing the editor's chip to
    # "Verified ✓" — the worst bug this product can have, per §17.12 — leaves EVERY
    # unit test, both §17.4 guard tests and the entire e2e suite green. Only subtest 4
    # of this file fails. Never drop it from this job.
    #
    # panel.scenarios.browser.test.js guards §10.4, §10.3 and §1.1's stale state. It was
    # written in M5 and was NOT in this loop when M5 finished — caught before the commit,
    # but that is the third time on this build a suite has existed without CI invoking it.
    # Whoever adds the eighth suite: add it here in the same change.
    #
    # mcp.browser.test.js is that eighth suite, added in M6 IN THE SAME CHANGE as the
    # file. It is the only place all three of §16's M6 acceptance lines are actually
    # performed: a real MCP client drives a real WebSocket into a real unpacked
    # extension, the demo's pill goes red because the SITE rendered it, killing the
    # browser mid-call produces an error in a quarter of a second, and a wrong pairing
    # code is refused. Removing it from this loop leaves M6 with no end-to-end evidence
    # at all — every remaining test on both sides of the socket fakes the other side.
    #
    # probe.browser.test.js guards M4. Deleting §7.2's two noise checks makes MockLab
    # report the demo's rotating tip box as VERIFIED — a false "Verified ✓" on an element
    # that changes by itself. probe.test.js catches that against a fake page; THIS suite
    # is what proves it against a real one.
    #
    # This comment first claimed the mutation left "every unit test in the repository
    # still green". That was false: probe.test.js fails it under all four readings of
    # "the two noise checks". The guard is stronger than the claim was — and the claim
    # was untrue in the file whose comment six lines down explains why a false statement
    # here is worse than no statement.
    #
    # panel.a11y.browser.test.js was added at M7 IN THE SAME CHANGE as the file. It is the
    # only place §16 M7's three DoD lines are actually performed — every control
    # keyboard-reachable, prefers-reduced-motion off the spring and the pop, and an RTL
    # smoke test — and each is a property of the WHOLE panel, so it sweeps all four tabs
    # rather than driving one flow. Restoring `tabindex="-1"` on the §10.2 source card
    # makes every source in the product mouse-only; subtests 1 and 2 of this file are the
    # only things in the repository that fail. It also holds WCAG 2.2 1.4.13 for every
    # tooltip in the panel, which is what the three "disabled controls explain themselves
    # only to a mouse" carry-forwards turned out to be one symptom of.
    #
    # highlight.browser.test.js was added in M6's gap-closing IN THE SAME
    # CHANGE as the file. §10.3's overlays are drawn by a function that runs in the page,
    # and everything that can be wrong with it is invisible to a unit test: a shadow root
    # a site's `border:0!important` would otherwise erase, a rect measured through the
    # entry transform, §6.2's re-resolution against a document that really changed, and a
    # container that has to be gone four seconds later. Deleting the confidence floor in
    # `background/highlight.js` makes MockLab draw a SOLID accent outline — the "this is
    # proved" overlay — around whatever element now sits at a remembered tree position;
    # subtest 4 of this file is what fails.
    #
    # panel.settings.browser.test.js was added in M7's addendum IN THE
    # SAME CHANGE as the file — and this is the fourth time that sentence has had to be
    # written by hand, so `extension/test/panel.settings.test.js` now CHECKS this loop
    # against the contents of `extension/test/`: a browser suite missing from the line
    # above fails an ordinary `node --test`, and so does a name here with no file behind
    # it. It is the only place §10.5's three formerly-unreachable controls are performed —
    # deep mode written as a PER-ORIGIN list into the real store (a boolean, or a write
    # that drops the other sites, passes every unit test and draws a perfect checkbox),
    # the §12.3 pairing screen and its two refusals, and §10.1D's "Save as Scenario".
    # Deleting the confirm step in `panel/settings.js` — so ticking the box attaches
    # Chrome's debugger before the person has been warned — fails subtest 1 of this file
    # and nothing else in the repository.
    #
    # deep.browser.test.js was added at M7 IN THE SAME CHANGE as the file.
    # §8 is the one feature whose central claim cannot be checked anywhere else: that a
    # document rewritten in flight by CDP Fetch still parses, hydrates and paints, and
    # that the SITE — not MockLab — turned the pill red. It also holds DEVIATION 1 in
    # `background/debuggerEngine.js` upright: the Fetch patterns are Document-only so
    # §5.1's in-page patch keeps XHR and fetch, and subtest 3 is what fails the day
    # somebody "fixes" that by muting the interceptor whenever deep mode is on.
    #
    # It found a real defect that every unit test was blind to: the document source is
    # captured while the response is still paused, which is BEFORE `agent.js` exists, and
    # the HELLO for that same document then cleared it — Sources stayed empty on the one
    # page deep mode is for. Nothing without a browser could have seen it.
    #
    # This comment deliberately carries no test totals. It used to say "all 142 unit
    # tests"; the suite grew to 146 and the number rotted in place, asserting something
    # false in the file whose whole job is to be trusted. The claim is stronger without
    # it — "every unit test" cannot go stale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install workspaces
        run: npm ci
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@^1.49
          npx playwright install --with-deps chromium
      # Every browser suite SKIPS rather than fails when Playwright or a Chromium build
      # is missing, so `node --test` would exit 0 with zero browser coverage and this job
      # would be green having proved nothing. Playwright is also not a declared
      # dependency of either workspace (see README Deviations) — it is installed by the
      # step above — so the skip path is reachable by an ordinary dependency change, not
      # only by sabotage.
      #
      # This repository has already shipped a browser suite that CI never invoked. The
      # wrapper below is the same lesson one step further on: it is not enough to invoke
      # the suite, the run has to be shown to have actually happened. Each suite must
      # report at least one pass and exactly zero skips.
      - name: Browser end-to-end tests
        working-directory: extension
        run: |
          set -euo pipefail
          for suite in deep e2e highlight mcp panel panel.a11y panel.probe panel.scenarios panel.settings picker pickerdom probe; do
            echo "::group::$suite.browser.test.js"
            out=$(node --test "test/$suite.browser.test.js" 2>&1) || { echo "$out"; exit 1; }
            echo "$out"
            echo "::endgroup::"
            skipped=$(printf '%s\n' "$out" | sed -n 's/^# skipped \([0-9][0-9]*\)$/\1/p' | tail -1)
            passed=$(printf '%s\n' "$out" | sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p' | tail -1)
            if [ "${skipped:-none}" != "0" ] || [ "${passed:-0}" -lt 1 ]; then
              echo "::error::$suite.browser.test.js did not really run (pass=${passed:-?} skipped=${skipped:-?}). A skipped browser suite is zero coverage reported as success."
              exit 1
            fi
          done
