name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install workspaces
        run: npm ci
      - name: Test
        run: npm test -ws
      - name: Check the extension manifest parses
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"

  browser:
    # Both browser suites load the REAL unpacked extension in real Chromium. They skip
    # themselves when Playwright is missing, so the job above stays green anywhere —
    # this job is what makes them actually run, and it must run BOTH files.
    #
    # e2e.browser.test.js guards defects unit tests could not see: a streaming response
    # that froze the page, a match entry that could not match its own URL, a stream that
    # was never released.
    #
    # panel.browser.test.js guards §1.1 itself. Changing the editor's chip to
    # "Verified ✓" — the worst bug this product can have, per §17.12 — leaves all 142
    # unit tests, both §17.4 guard tests and the entire e2e suite green. Only subtest 4
    # of this file fails. Never drop it from this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install workspaces
        run: npm ci
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@^1.49
          npx playwright install --with-deps chromium
      - name: Browser end-to-end tests (capture engine)
        run: node --test test/e2e.browser.test.js
        working-directory: extension
      - name: Browser end-to-end tests (side panel)
        run: node --test test/panel.browser.test.js
        working-directory: extension
