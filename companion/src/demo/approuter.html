<!--
  PLAN.md §8 asks deep mode to read "a site that already shows data the moment it opens".
  `ssr.html` beside this file is that page as the PAGES Router writes it: one JSON island
  in a script element typed `application/json`. THIS page is the same trip card as the APP
  ROUTER writes it, and the two documents have almost nothing in common.

  An App Router page carries its data as React's flight stream, pushed into a global in
  a run of inline scripts, each one carrying a call like this:

      self.__next_f.push([1,"3:[\"$\",\"div\",null,{…}]\n"])   — one of many, inline

  Three things about that shape defeat a reader written for the other one, and this page
  exists to hold all three at once:

    1. the payload is TEXT INSIDE A JAVASCRIPT STRING LITERAL, so every quote in the data
       arrives as `\"` and every row terminator as `\n` — two characters, not one;
    2. the stream is a sequence of `<id>:<payload>` rows and NOT every row is JSON: `HL`
       is a preload hint, `I` a client-module reference, `T` a raw text chunk whose
       header carries a byte length and whose body may contain real newlines;
    3. ONE row is routinely cut across SEVERAL pushes, wherever the server flushed. Row 0
       below spans three of them, and one boundary falls inside the word `ON_TIME` that
       the status pill is rendered from. A reader that treats a push as a unit sees
       `"status":"ON_T` and finds nothing.

  ── WHAT IS FAITHFUL HERE AND WHAT IS RECONSTRUCTED ───────────────────────────────────
  FAITHFUL (measured against real App Router output): the `self.__next_f` global and the
  `(self.__next_f=self.__next_f||[]).push([0])` bootstrap before the data chunks; the
  `[1, "…"]` chunk shape; `JSON.stringify` escaping with `<`, `>` and `&` written as
  `\u003c`, `\u003e`, `\u0026`; `<id>:<payload>\n` rows with lowercase hex ids; `$`/`$L`
  element and reference markers inside the model; and rows split at arbitrary offsets.

  RECONSTRUCTED — plausible, and not lifted from a real build: the particular row ids and
  their order; the module ids inside the `I` rows; the exact set of row tags a real page
  would emit (a real one has more, and a dev build has `D` rows this has none of); and
  the `T` row's length semantics, which are read here as a hex count of UTF-8 BYTES. If
  that last one is wrong about real Next.js, this page is wrong the same way the
  extension is — which is why `flightData.js` refuses to rewrite any document whose `T`
  count does not land exactly on a newline, and reports it as a source that cannot be
  edited rather than guessing.

  WHAT THIS PAGE SHOWS THAT `ssr.html` CANNOT: the card is rendered from the concatenated
  stream, so changing `trip.status` inside a string literal that was cut in half turns
  the pill red THROUGH THE SITE'S OWN CODE (§1.3). `#printed-note` is server text that
  nothing re-renders and keeps saying what the server said — the honest limit of a data
  rewrite, on screen, exactly as in `ssr.html`.

  It fetches nothing and loads no external file, for the same reason `ssr.html` does not:
  with deep mode OFF, MockLab captures no source here at all, which is the honest failure
  §11's `pick.noCandidates` describes.
-->

  <script>
  /*
   * The hydration step, and the only part of this page that is not a reconstruction of
   * server output: it stands in for `react-server-dom-webpack`'s client runtime, which
   * is far too large to inline and whose job here is exactly three things —
   *
   *   1. read every chunk already in `self.__next_f` AND every one pushed after it, by
   *      replacing `push` the way the real runtime does;
   *   2. CONCATENATE the chunk strings before parsing anything, because a row is cut
   *      wherever the server flushed and no chunk is a unit of meaning;
   *   3. split the stream into `<id>:<payload>\n` rows, resolve a `"$<id>"` reference to
   *      another row, and render the props of the client component `$L3`.
   *
   * `T` rows carry raw text with a byte length in their header, so they are the one row
   * whose end is not the next newline. The reader consumes them by UTF-8 byte count —
   * the same reading `extension/src/background/flightData.js` uses, and the same
   * reconstruction. If that reading is wrong about real Next.js output, this page and
   * that file are wrong together, which is why the extension checks the count lands on a
   * newline and refuses to rewrite a document where it does not.
   *
   * What this page proves that `ssr.html` cannot: the card below is rendered from the
   * FLIGHT STREAM, so a value MockLab changed inside a JS string literal — one that was
   * cut in half across two `push` calls — is a value the site's own code renders.
   */
  (function () {
    'use strict';

    var STATUS_PRESENTATION = {
      ON_TIME:   { label: 'On time',   cls: '',             banner: null },
      DELAYED:   { label: 'Delayed',   cls: 'is-delayed',   banner: 'Your flight is delayed. Check back for a new departure time.' },
      CANCELLED: { label: 'Cancelled', cls: 'is-cancelled', banner: 'Your flight was cancelled' },
      BOARDING:  { label: 'Boarding',  cls: '',             banner: null },
      LANDED:    { label: 'Landed',    cls: '',             banner: null }
    };

    function $(id) { return document.getElementById(id); }
    function setText(id, value) { var el = $(id); if (el) el.textContent = value; }

    function utf8Length(text) {
      return typeof TextEncoder === 'function'
        ? new TextEncoder().encode(text).length
        : unescape(encodeURIComponent(text)).length;
    }

    /** How many CHARACTERS of `text` from `at` make up `bytes` UTF-8 bytes, or -1. */
    function advanceBytes(text, at, bytes) {
      var left = bytes;
      var i = at;
      while (left > 0 && i < text.length) {
        var code = text.codePointAt(i);
        var width = code > 0xffff ? 2 : 1;
        left -= utf8Length(text.substr(i, width));
        i += width;
      }
      return left === 0 ? i : -1;
    }

    /** `{id: value}` for every row of the stream this reader understands. */
    function readRows(stream) {
      var rows = {};
      var at = 0;
      while (at < stream.length) {
        var header = /^([0-9a-f]{1,8}):/.exec(stream.slice(at, at + 10));
        if (!header) break;
        var start = at + header[0].length;
        if (stream.charAt(start) === 'T') {
          var comma = stream.indexOf(',', start + 1);
          if (comma === -1) break;
          var end = advanceBytes(stream, comma + 1, parseInt(stream.slice(start + 1, comma), 16));
          if (end === -1 || stream.charAt(end) !== '\n') break;
          rows[header[1]] = stream.slice(comma + 1, end);
          at = end + 1;
          continue;
        }
        var newline = stream.indexOf('\n', start);
        if (newline === -1) break;
        var payload = stream.slice(start, newline);
        if (payload.charAt(0) === '[' || payload.charAt(0) === '{') {
          try { rows[header[1]] = JSON.parse(payload); } catch (err) { /* not a model row */ }
        }
        at = newline + 1;
      }
      return rows;
    }

    /** The props of the first `["$","$L<id>",…,props]` node in the tree. */
    function findClientProps(node) {
      if (!node || typeof node !== 'object') return null;
      if (Object.prototype.toString.call(node) === '[object Array]') {
        if (node[0] === '$' && typeof node[1] === 'string' && node[1].indexOf('$L') === 0 && node[3] && node[3].trip) {
          return node[3];
        }
        for (var i = 0; i < node.length; i += 1) {
          var found = findClientProps(node[i]);
          if (found) return found;
        }
        return null;
      }
      for (var key in node) {
        if (Object.prototype.hasOwnProperty.call(node, key)) {
          var hit = findClientProps(node[key]);
          if (hit) return hit;
        }
      }
      return null;
    }

    /** `"$5"` is the value of row 5; `"$$x"` is the literal string `$x`. */
    function resolve(value, rows) {
      if (typeof value !== 'string' || value.charAt(0) !== '$') return value;
      if (value.charAt(1) === '$') return value.slice(1);
      var row = rows[value.slice(1)];
      return row === undefined ? value : row;
    }

    function formatTime(iso) {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '--:--';
      return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
    }

    function formatMoney(amount, currency) {
      var n = Number(amount);
      return isNaN(n) ? String(amount) : currency + ' ' + n.toFixed(2);
    }

    function renderStatus(status) {
      var view = STATUS_PRESENTATION[status] || { label: String(status), cls: '', banner: null };
      var pill = $('status-pill');
      var dot = $('status-dot');
      var banner = $('alert-banner');
      pill.textContent = view.label;
      pill.className = view.cls;
      dot.className = view.cls;
      if (view.banner) {
        banner.textContent = view.banner;
        banner.classList.add('is-visible');
      } else {
        banner.textContent = '';
        banner.classList.remove('is-visible');
      }
    }

    function render(props, rows) {
      var trip = props.trip || {};
      var flight = trip.flight || {};
      var origin = flight.origin || {};
      var destination = flight.destination || {};
      var price = trip.price || {};
      var currency = price.currency || 'SAR';
      var total = Number(price.total || 0);
      var taxes = total * Number(price.taxRate || 0) / (1 + Number(price.taxRate || 0));

      setText('passenger-chip', (props.user && props.user.displayName) || '');
      setText('flight-number', flight.number || '');
      setText('flight-ref', (flight.carrier || '') + ' · Booking ' + ((trip.booking && trip.booking.reference) || ''));
      renderStatus(trip.status);
      setText('departs-at', formatTime(flight.departsAt));
      setText('arrives-at', formatTime(flight.arrivesAt));
      setText('origin-code', origin.code || '');
      setText('origin-city', origin.city || '');
      setText('destination-code', destination.code || '');
      setText('destination-city', destination.city || '');
      setText('price-base', formatMoney(total - taxes, currency));
      setText('price-taxes', formatMoney(taxes, currency));
      setText('price-total', formatMoney(total, currency));
      setText('gate-note', String(resolve(trip.note, rows)).split('\n')[0]);
      // #printed-note is deliberately NOT re-rendered: it is what the server printed,
      // and nothing re-renders it. See the header comment.
    }

    function hydrate() {
      var chunks = self.__next_f || [];
      var stream = '';
      for (var i = 0; i < chunks.length; i += 1) {
        if (chunks[i] && chunks[i][0] === 1 && typeof chunks[i][1] === 'string') stream += chunks[i][1];
      }
      var rows = readRows(stream);
      var props = findClientProps(rows['0']);
      if (!props) throw new Error('no client component in the stream');
      render(props, rows);
    }

    try {
      hydrate();
      // The real runtime replaces `push` so that chunks flushed after it starts are fed
      // straight into the parser. This page has none, and does it anyway: a reader that
      // only ever saw the array as it stood is a reader that would not notice.
      var array = self.__next_f;
      var push = array.push.bind(array);
      array.push = function (chunk) { var n = push(chunk); try { hydrate(); } catch (e) {} return n; };
    } catch (err) {
      console.error('[demo] the page\'s streamed data could not be read', err);
      var banner = document.getElementById('alert-banner');
      banner.textContent = 'Could not read your trip. Refresh the page to try again.';
      banner.classList.add('is-visible');
    }
  })();
  </script>
